<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HealthifyAI Chatbot</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <div class="chat-container">
    <div class="chat-box glass-card">
      <!-- Header -->
      <div class="chat-header">
        <img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="bot-avatar" alt="Bot">
        <div>
          <h5>HealthifyAI</h5>
          <p class="small">Your AI Health Assistant</p>
        </div>
      </div>

      <!-- Messages -->
      <div id="messageFormeight" class="chat-body"></div>

      <!-- Input -->
      <div class="chat-footer">
        <form id="messageArea" class="input-group">
          <input type="text" id="text" name="msg" placeholder="Type your message..." autocomplete="off" required class="form-control rounded-pill">
          <button type="submit" id="send" class="btn btn-send rounded-circle">
            <i class="fas fa-paper-plane"></i>
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- JS -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    $(document).ready(function() {
      $("#messageArea").on("submit", function(event) {
        event.preventDefault();
        const date = new Date();
        const time = date.getHours() + ":" + String(date.getMinutes()).padStart(2, '0');
        const userMsg = $("#text").val();

        const userHTML = `
          <div class="message user-msg">
            <div class="msg-content">${userMsg}</div>
            <span class="msg-time">${time}</span>
          </div>`;
        
        $("#text").val("");
        $("#messageFormeight").append(userHTML);
        $("#messageFormeight").scrollTop($("#messageFormeight")[0].scrollHeight);

        $.ajax({
          data: { msg: userMsg },
          type: "POST",
          url: "/get",
        }).done(function(data) {
          const botHTML = `
            <div class="message bot-msg">
              <img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="bot-icon" alt="bot">
              <div class="msg-content">${data}</div>
              <span class="msg-time">${time}</span>
            </div>`;
          $("#messageFormeight").append(botHTML);
          $("#messageFormeight").scrollTop($("#messageFormeight")[0].scrollHeight);
        });
      });
    });
  </script>
</body>
</html>
